<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Document Text Analytics Core</title>
    <style>
        :root {
            --bg-primary: #f8fafc;
            --surface: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --brand: #2563eb;
            --brand-hover: #1d4ed8;
            --border: #e2e8f0;
        }

        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            max-width: 900px; 
            margin: 40px auto; 
            padding: 20px; 
            background: var(--bg-primary); 
            color: var(--text-main); 
        }

        .wrapper { 
            background: var(--surface); 
            padding: 35px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); 
            border: 1px solid var(--border); 
        }

        .header-area {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
        }

        .header-area h2 { margin: 0 0 8px 0; font-size: 24px; font-weight: 700; }
        .header-area p { margin: 0; color: var(--text-muted); font-size: 15px; }

        .dropzone { 
            border: 2px dashed #cbd5e1; 
            background: #f1f5f9; 
            padding: 30px; 
            text-align: center; 
            border-radius: 8px; 
            font-weight: 500; 
            cursor: pointer; 
            margin-bottom: 20px; 
            transition: border-color 0.2s, background 0.2s; 
        }
        .dropzone:hover { border-color: var(--brand); background: #f8fafc; }

        .trigger-btn { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            background: var(--brand); 
            color: #ffffff; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        .trigger-btn:hover { background: var(--brand-hover); }

        .tracker-status { 
            display: none; 
            margin: 20px 0; 
            color: var(--brand); 
            font-weight: 600; 
            font-size: 14px;
            padding: 12px;
            background: #eff6ff;
            border-radius: 6px;
            border: 1px solid #bfdbfe;
        }

        .output-container {
            margin-top: 35px;
            display: none;
        }

        .output-container h3 {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .medical-table-wrapper {
            width: 100%;
            overflow-x: auto;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
        }

        th {
            background: #f1f5f9;
            color: #334155;
            font-weight: 600;
            padding: 12px 16px;
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            color: #334155;
        }

        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #f8fafc; }

        .section-header-row {
            background: #f8fafc;
            font-weight: 600;
            color: var(--brand);
        }
        .section-header-row td {
            color: var(--brand);
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header-area">
        <h2>Medical Analysis Hub</h2>
        <p>Transmit an uncompressed clinical script or lab record image into rows.</p>
    </div>

    <form id="payloadSubmitForm">
        <div class="dropzone">
            <input type="file" id="filePayload" accept="image/*" required>
        </div>
        <button type="submit" class="trigger-btn">Analyze and Process Stream</button>
    </form>

    <div class="tracker-status" id="indicatorText">
        Processing spatial document analytics matrix... Please hold.
    </div>

    <div class="output-container" id="outputSection">
        <h3>Compiled Analytical Records Grid</h3>
        <div class="medical-table-wrapper">
            <table id="medicalDataTable">
                <thead>
                    <tr id="tableHeaderRow">
                        <!-- Columns populated dynamically -->
                    </tr>
                </thead>
                <tbody id="tableBodyRows">
                    <!-- Rows populated dynamically -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    document.getElementById('payloadSubmitForm').addEventListener('submit', async (triggerEvent) => {
        triggerEvent.preventDefault();
        
        const selectionInput = document.getElementById('filePayload');
        const processingLabel = document.getElementById('indicatorText');
        const outputSection = document.getElementById('outputSection');
        const tableHeader = document.getElementById('tableHeaderRow');
        const tableBody = document.getElementById('tableBodyRows');
        
        if (!selectionInput.files[0]) return;
        
        const compositeForm = new FormData();
        compositeForm.append('document_img', selectionInput.files[0]);
        
        processingLabel.style.display = 'block';
        outputSection.style.display = 'none';
        tableHeader.innerHTML = '';
        tableBody.innerHTML = '';
        
        try {
            const networkResponse = await fetch('/process-image', { method: 'POST', body: compositeForm });
            const serverReply = await networkResponse.json();
            
            if (networkResponse.ok && serverReply.extracted_text) {
                renderStructuredGrid(serverReply.extracted_text, tableHeader, tableBody);
                outputSection.style.display = 'block';
            } else {
                alert(`Transmission Error: ${serverReply.error || 'No text extracted.'}`);
            }
        } catch(connectionFault) {
            alert("Hardware Communication Error: Lost connection with local system microservice.");
        } finally {
            processingLabel.style.display = 'none';
        }
    });

    function renderStructuredGrid(rawText, headerElement, bodyElement) {
        const rows = rawText.split('\n').map(line => line.trim()).filter(line => line.length > 0);
        if (rows.length === 0) return;

        let totalColumnsCount = 0;
        let dataMatrix = [];

        rows.forEach(row => {
            const cells = row.split('|').map(cell => cell.trim());
            // FIX: Replaced .append() with proper JavaScript .push() syntax
            dataMatrix.push(cells);
            if (cells.length > totalColumnsCount) {
                totalColumnsCount = cells.length; 
            }
        });

        let headerLabels = ["Metric / Parameter", "Observed Value", "Measurement Unit", "Reference Range Context"];
        const maxCols = Math.max(totalColumnsCount, headerLabels.length);
        
        for (let idx = 0; idx < maxCols; idx++) {
            const th = document.createElement('th');
            th.textContent = headerLabels[idx] || `Field Layer ${idx + 1}`;
            headerElement.appendChild(th);
        }

        dataMatrix.forEach(cells => {
            const tr = document.createElement('tr');

            if (cells.length === 1 || (cells.length > 1 && cells[1] === "" && cells[2] === undefined)) {
                tr.classList.add('section-header-row');
                const td = document.createElement('td');
                td.setAttribute('colspan', maxCols);
                td.textContent = cells[0];
                tr.appendChild(td);
            } else {
                for (let idx = 0; idx < maxCols; idx++) {
                    const td = document.createElement('td');
                    td.textContent = cells[idx] !== undefined ? cells[idx] : "";
                    tr.appendChild(td);
                }
            }
            bodyElement.appendChild(tr);
        });
    }
</script>
</body>
</html>
